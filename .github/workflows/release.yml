name: Release

# Fires on an annotated `v*` tag. `git tag -a vX.Y.Z -m "vX.Y.Z" && git push
# origin main --follow-tags` — a lightweight tag is skipped by --follow-tags,
# this workflow never runs, and the result is a repository whose install
# instructions all fail, which is a state real projects ship by accident.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rbx-observe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rbx-observe.exe
          # Apple Silicon only. macOS runners bill at 10x, and the Intel leg is
          # the most expensive artifact here for the shrinking half of the
          # platform. Restoring it is four lines.
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: rbx-observe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - run: cargo build --release --target ${{ matrix.target }} --bin rbx-observe

      # The archive holds the bare binary at its root — no directory, no
      # README beside it. Rokit extracts the executable it finds and a nested
      # folder is one more thing between the download and a working tool.
      # The name carries the Rust target triple, which is what Rokit matches
      # against the host's OS and architecture.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          zip ../../../rbx-observe-${{ github.ref_name }}-${{ matrix.target }}.zip ${{ matrix.binary }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.binary }} -DestinationPath ../../../rbx-observe-${{ github.ref_name }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bins-${{ matrix.target }}
          path: rbx-observe-*.zip

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - run: sha256sum rbx-observe-*.zip > SHA256SUMS
      # Published, not a draft. Rokit resolves against the GitHub releases API,
      # which does not show drafts to anyone but the maintainer — a draft
      # release is indistinguishable from no release for every install command
      # in the README. The tag is the deliberate act; this step just finishes
      # it.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          generate_release_notes: true
          files: |
            rbx-observe-*.zip
            SHA256SUMS
