name: Release

# Fires on an annotated `v*` tag. `git tag -a vX.Y.Z -m "vX.Y.Z" && git push
# origin main --follow-tags`: a lightweight tag is skipped by --follow-tags,
# this workflow never runs, and the result is a repository whose install
# instructions all fail, which is a state real projects ship by accident.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# The build runs with read access only: it compiles every dependency's build
# script. The publishing job alone asks for write access, so a compromised
# build step cannot write to the repository or mint an attestation.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rbx-observe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rbx-observe.exe
          # Apple Silicon only. macOS runners bill at 10x, and the Intel leg is
          # the most expensive artifact here for the shrinking half of the
          # platform. Restoring it is four lines.
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: rbx-observe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      # `--locked`: the archive must come from the dependency graph CI tested
      # and cargo-deny audited, not one cargo resolved afresh at tag time.
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin rbx-observe

      # The archive holds the bare binary at its root (no directory, no
      # README beside it). Rokit extracts the executable it finds and a nested
      # folder is one more thing between the download and a working tool.
      # The name carries the Rust target triple, which is what Rokit matches
      # against the host's OS and architecture.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          zip ../../../rbx-observe-${{ github.ref_name }}-${{ matrix.target }}.zip ${{ matrix.binary }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.binary }} -DestinationPath ../../../rbx-observe-${{ github.ref_name }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bins-${{ matrix.target }}
          path: rbx-observe-*.zip

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Both are what `actions/attest-build-provenance` needs: an OIDC token to
      # sign with, and the right to store the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true
      - run: sha256sum rbx-observe-*.zip > SHA256SUMS
      # `gh attestation verify <zip> --repo rbx-forge/rbx-observe` proves the
      # archive was built here, from this tag.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rbx-observe-*.zip
      # Published, not a draft. Rokit resolves against the GitHub releases API,
      # which does not show drafts to anyone but the maintainer: a draft
      # release is indistinguishable from no release for every install command
      # in the README. The tag is the deliberate act; this step just finishes
      # it.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: |
            rbx-observe-*.zip
            SHA256SUMS
