[workspace]
resolver = "2"
members = ["crates/rbx-observe"]

[workspace.package]
version = "0.2.0"
edition = "2021"
# Matches rbx-cli's floor rather than being derived from this tree's own
# dependencies, which are too few to constrain anything yet. Revisit when a
# dependency actually raises it.
rust-version = "1.88"
license = "MPL-2.0"
repository = "https://github.com/rbx-forge/rbx-observe"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
reqwest = { version = "0.12", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Not `features = ["full"]`. There is no `tokio::spawn` here: tokio is
# reqwest's runtime, plus `macros` for `#[tokio::main]`/`#[tokio::test]`,
# `time` for retry backoff and request pacing, and `sync` for the pacer's
# mutex. Adding one back should be a considered one-line change.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
wiremock = "0.6"
# Snapshot the human output: the layout is a contract with whoever reads it,
# and a fragment assertion passes while everything around it degrades.
insta = "1"
# Drives the built binary, which is the only way to test the clap surface,
# the exit codes and the messages a user actually meets.
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
# Same posture as rbx-cli: an unused item is either wired up or deleted, and
# a deliberate exception carries a narrow allow with a reason.
dead_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
